services:
  postgres:
    image: postgres:17-alpine
    container_name: recipes-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recipes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipes}
      POSTGRES_DB: ${POSTGRES_DB:-recipes_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - recipes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recipes} -d ${POSTGRES_DB:-recipes_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recipes_pg_data:
